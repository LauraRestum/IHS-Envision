<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Presenter view | Supporting the IHS mission through MSPV | Envision</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <style>
    @font-face { font-family: 'Montserrat'; font-weight: 400; font-display: swap; src: url('assets/fonts/montserrat-400.woff2') format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-weight: 600; font-display: swap; src: url('assets/fonts/montserrat-600.woff2') format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-weight: 700; font-display: swap; src: url('assets/fonts/montserrat-700.woff2') format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-weight: 800; font-display: swap; src: url('assets/fonts/montserrat-800.woff2') format('woff2'); }
    :root {
      --bg: #000d2e; --panel: #001852; --green: #78BE21; --gold: #FFCF00;
      --text: #f0f4ff; --muted: rgba(240,244,255,0.62); --border: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; padding: 24px 28px;
    }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 2px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .eyebrow { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--green); }
    h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.01em; margin-top: 4px; }
    .timer { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
    .timer-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); display: block; text-align: right; }
    .meta { font-size: 0.78rem; font-weight: 600; color: var(--muted); margin-bottom: 14px; }
    .next { border-left: 2px solid var(--green); background: var(--panel); border-radius: 2px; padding: 10px 14px; font-size: 0.82rem; font-weight: 600; margin-bottom: 18px; }
    .notes { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--border); border-radius: 2px; padding: 20px 24px; font-size: 1rem; line-height: 1.8; font-weight: 500; }
    .notes .notes-flag { display: inline-block; background: rgba(255,207,0,0.16); border: 1px solid rgba(255,207,0,0.5); border-radius: 2px; color: var(--gold); font-weight: 700; padding: 0 6px; }
    .controls { display: flex; gap: 10px; margin-top: 18px; }
    .controls button {
      font-family: inherit; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 2px;
      padding: 0.7rem 1.6rem; min-height: 44px; cursor: pointer;
    }
    .controls button:hover { border-color: var(--green); }
    .controls .primary { background: var(--green); color: #001852; border-color: var(--green); }
    .waiting { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="eyebrow">Presenter view</span>
      <h1 id="pTitle">Waiting for the deck</h1>
    </div>
    <div>
      <span class="timer-label">Elapsed</span>
      <span class="timer" id="pTimer" role="timer" aria-label="Elapsed time">00:00</span>
    </div>
  </header>
  <main style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
    <p class="meta" id="pMeta">Open this window from the deck with the P key. It stays in sync automatically.</p>
    <p class="next" id="pNext">Next: waiting for the deck</p>
    <div class="notes" id="pNotes" aria-live="off">
      <p class="waiting">Presenter notes for the current slide appear here.</p>
    </div>
    <div class="controls">
      <button type="button" id="pPrev">Back</button>
      <button type="button" id="pNextBtn" class="primary">Advance</button>
    </div>
  </main>
  <script src="js/presenter.js"></script>
</body>
</html>
